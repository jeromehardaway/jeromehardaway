<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120">
<style>
.rail{fill:none;stroke:#C5203E;stroke-width:3}
.rail2{fill:none;stroke:#C5203E;stroke-width:1;opacity:.55}
.stencil{font-family:stencil}.type{font-family:type}
</style>
<defs>
<!-- lines sit inside pixel rows, never on a slice edge -->
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M0 20.5H40M20.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
<path d="M0 0.5H40M0.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>
</defs>
<rect width="840" height="120" fill="#091F40"/>
<rect width="840" height="120" fill="url(#grid)"/>
<path d="M14 0V120M826 0V120" class="rail"/><path d="M21 0V120M819 0V120" class="rail2"/>

</svg>
