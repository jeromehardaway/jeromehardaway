<svg xmlns="http://www.w3.org/2000/svg" width="840" height="80" viewBox="0 0 840 80">
<style>@font-face{font-family:stencil;src:url(data:font/woff2;base64,)}
.rail{fill:none;stroke:#C5203E;stroke-width:3}
.rail2{fill:none;stroke:#C5203E;stroke-width:1;opacity:.55}
.stencil{font-family:stencil}.type{font-family:type}
</style>
<defs>
<!-- grid lines sit inside pixel rows, never on a slice edge -->
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M0 20.5H40M20.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
<path d="M0 0.5H40M0.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
<circle cx="3" cy="3" r="1.1" fill="#091F40" opacity=".18"/>
</pattern>
</defs>
<rect width="840" height="80" fill="#091F40"/>
<rect width="840" height="80" fill="url(#grid)"/>
<path d="M14 0V80" class="rail"/><path d="M826 0V80" class="rail"/><path d="M21 0V80" class="rail2"/><path d="M819 0V80" class="rail2"/>
<rect x="40" y="20" width="269" height="40" fill="#FFFFFF"/>
<rect x="239" y="20" width="70" height="40" fill="url(#dots)"/>
<rect x="40" y="20" width="8" height="40" fill="#C5203E"/>
<text x="62.0" y="49.0" class="stencil" font-size="22.0" fill="#091F40" letter-spacing="2">FIELD REPORTS</text>

</svg>
