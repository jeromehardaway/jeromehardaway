<svg xmlns="http://www.w3.org/2000/svg" width="840" height="40" viewBox="0 0 840 40">
<style>
.rail{fill:none;stroke:#C5203E;stroke-width:3}
.rail2{fill:none;stroke:#C5203E;stroke-width:1;opacity:.55}
.stencil{font-family:stencil}.type{font-family:type}
</style>
<defs>
<!-- grid lines sit inside pixel rows, never on a slice edge -->
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M0 20.5H40M20.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
<path d="M0 0.5H40M0.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
<circle cx="3" cy="3" r="1.1" fill="#091F40" opacity=".18"/>
</pattern>
</defs>
<rect width="840" height="40" fill="#091F40"/>
<rect width="840" height="40" fill="url(#grid)"/>
<path d="M14 0V16q0 10 10 10H816q10 0 10-10V0" class="rail"/><path d="M21 0V18" class="rail2"/><path d="M819 0V18" class="rail2"/>
<rect x="252" width="336" height="8" fill="#FFFFFF"/>
</svg>
