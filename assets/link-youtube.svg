<svg xmlns="http://www.w3.org/2000/svg" width="168" height="80" viewBox="0 0 168 80">
<style>@font-face{font-family:stencil;src:url(data:font/woff2;base64,)}
.rail{fill:none;stroke:#C5203E;stroke-width:3}
.rail2{fill:none;stroke:#C5203E;stroke-width:1;opacity:.55}
.stencil{font-family:stencil}.type{font-family:type}
</style>
<defs>
<!-- grid lines sit inside pixel rows, never on a slice edge -->
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M0 20.5H40M20.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
<path d="M0 0.5H40M0.5 0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/>
</pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
<circle cx="3" cy="3" r="1.1" fill="#091F40" opacity=".18"/>
</pattern>
</defs>
<rect width="168" height="80" fill="#091F40"/>
<rect width="168" height="80" fill="url(#grid)"/>

<rect x="13" y="20" width="128" height="40" rx="4" fill="#FFFFFF"/>
<rect x="13" y="20" width="6" height="40" rx="2" fill="#C5203E"/>
<text x="80.0" y="46.0" class="stencil" font-size="15.0" fill="#091F40" text-anchor="middle" letter-spacing="1">YOUTUBE</text>
</svg>
